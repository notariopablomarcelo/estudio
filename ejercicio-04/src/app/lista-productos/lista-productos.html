<section class="productos">
  <h2>Productos</h2>

  @if (svc.productos().length > 0) {
    <p>Tenés {{ svc.productos().length }} producto(s).</p>
  }

  @for (p of svc.productos(); track p.id) {
    <div class="producto">
      <strong>{{ p.name }}</strong> — ${{ p.price }}
      <span>{{ p.stock }} en stock</span>
      <button (click)="svc.eliminar(p.id)">Eliminar</button>
    </div>
  } @empty {
    <p>No hay productos.</p>
  }

  <div class="botones">
    <button (click)="svc.agregar()">+ Agregar</button>
    <button (click)="svc.vaciar()">Vaciar</button>
  </div>
</section>
