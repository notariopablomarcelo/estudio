<section class="productos">
    <h2>Productos</h2>

    @if (productos.length > 0) {
      <p>Tenés {{ productos.length }} producto(s).</p>
    }

    @for (p of productos(); track p.id) {
      <div class="producto">
        <strong>{{ p.name }}</strong> — ${{ p.price }}
        <span>{{ p.stock }} en stock</span>
      </div>
    } @empty {
      <p>No hay productos.</p>
    }

    <div class="botones">
      <button (click)="agregarProducto()">+ Agregar</button>
      <button (click)="vaciarProductos()">Vaciar</button>
    </div>
  </section>
